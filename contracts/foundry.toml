[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/",
]
allow_paths = [".."]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 100
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 1024
depth = 200

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[lint]
exclude_lints = ["asm-keccak256"]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
